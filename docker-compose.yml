version: '3.9'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: dr360_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dr360
      POSTGRES_PASSWORD: dev_password_change_in_prod
      POSTGRES_DB: disaster_response_360
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dr360 -d disaster_response_360"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dr360_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
